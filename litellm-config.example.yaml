# LiteLLM Proxy Configuration for MCP OpenAlex Server
# Documentation: https://docs.litellm.ai/docs/mcp

model_list:
  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4
      api_key: os.environ/OPENAI_API_KEY

mcp_servers:
  # Option 1: HTTP Transport (Recommended for production)
  openalex-http:
    url: "http://127.0.0.1:8000"
    transport: "http"
    description: "OpenAlex scholarly database search"

  # Option 2: STDIO Transport (for local/development)
  openalex-stdio:
    command: "uv"
    args:
      - "run"
      - "--directory"
      - "/path/to/mcp-openalex"
      - "python"
      - "src/server.py"
    env:
      OPENALEX_API_KEY: "your-api-key-here"
    description: "OpenAlex scholarly database search (stdio)"
